name: Validate SaanTayo
on:
  pull_request:
  push:
    branches: [main, "upgrade/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - run: pnpm audit --prod
      - run: pnpm exec wrangler deploy --dry-run --outdir worker-build
        env:
          WRANGLER_SEND_METRICS: "false"
